<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8e7e4">
  <title>Estelatte | Menú</title>
  <meta name="description" content="Menú de Estelatte Coffee & More">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="hero">
    <span class="spark spark-1" aria-hidden="true">✦</span>
    <span class="spark spark-2" aria-hidden="true">✧</span>
    <img class="logo" src="img/logo.png" alt="Estelatte Good Moments">
  </header>

  <main>
    <section class="intro" aria-labelledby="titulo-menu">
      <p class="eyebrow">COFFEE &amp; MORE</p>
      <h1 id="titulo-menu">MENÚ</h1>
      <div class="heart-line" aria-hidden="true"><span></span>♥<span></span></div>
      <p class="tagline">Hechas con amor, para ti.</p>
    </section>

    <nav class="category-nav" aria-label="Categorías del menú">
      <button class="category-btn active" data-category="sodas" type="button"> <span>Sodas Italianas</span></button>
      <button class="category-btn" data-category="frios" type="button"> <span>Bebidas Frías</span></button>
      <button class="category-btn" data-category="frappes" type="button"> <span>Frappés</span></button>
      <button class="category-btn" data-category="calientes" type="button"> <span>Bebidas Calientes</span></button>
    </nav>

    <section id="menuContent" class="menu-content" aria-live="polite"></section>
  </main>

  <footer class="footer">
    <p>Disfruta cada momento, disfruta Estelatte.</p>
    <div class="socials" aria-label="Redes sociales de Estelatte">
      <a href="mailto:estelatte.coffee@gmail.com" aria-label="Enviar correo a Estelatte" title="Correo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v14H3V5Zm2 2v.6l7 5 7-5V7H5Zm14 10V10l-7 5-7-5v7h14Z"/></svg>
      </a>
      <a href="https://www.instagram.com/estelatte.coffee?igsi=dngzdmd5djRydmIz&utm_source=qr" target="_blank" rel="noopener noreferrer" aria-label="Instagram de Estelatte" title="Instagram">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5Zm0 2a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7Zm11.2 1.5a1.3 1.3 0 1 1 0 2.6 1.3 1.3 0 0 1 0-2.6ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/></svg>
      </a>
      <a href="https://www.facebook.com/share/1KouM7Hnfg/?mibextid=wwXIfr" target="_blank" rel="noopener noreferrer" aria-label="Facebook de Estelatte" title="Facebook">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 22v-8h2.7l.4-3h-3.1V9.1c0-.9.3-1.6 1.6-1.6h1.7V4.8c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3v2H7.3v3h2.8v8h3.4Z"/></svg>
      </a>
      <a href="https://www.tiktok.com/@estelatte.coffee?_r=1&_t=ZS-99584gqNJIO" target="_blank" rel="noopener noreferrer" aria-label="TikTok de Estelatte" title="TikTok">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h3c.3 1.7 1.3 2.8 3 3.4V9c-1.2-.1-2.3-.5-3-1.1v7.2a6 6 0 1 1-5.2-5.9v3a3 3 0 1 0 2.2 2.9V3Z"/></svg>
      </a>
    </div>
    <small>© <span id="year"></span> Estelatte Coffee &amp; More</small>
  </footer>

  <div class="modal" id="drinkModal" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>
    <article class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" type="button" aria-label="Cerrar" data-close-modal>×</button>
      <div class="modal-image-wrap"><img id="modalImage" src="" alt=""></div>
      <div class="modal-info">
        <div class="modal-heading-row">
          <h2 id="modalTitle"></h2>
          <span id="modalPrice" class="modal-price"></span>
        </div>
        <p id="modalDescription" class="modal-description"></p>
        <h3>Incluye:</h3>
        <ul id="modalIngredients" class="ingredient-list"></ul>
      </div>
    </article>
  </div>

  <script src="js/menu.js"></script>
</body>
</html>
